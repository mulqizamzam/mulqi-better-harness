name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check (every tracked .mjs under scripts/)
        run: |
          git ls-files 'scripts/*.mjs' 'scripts/**/*.mjs' | xargs -r -n1 node --check
      - name: Materialize vendor audit manifest
        run: node scripts/self-audit/materialize-manifest.mjs
      - name: Run test suite
        run: node --test tests/*.test.js
      - name: Guard: vendor-integrity suite actually executed
        run: node scripts/self-audit/integrity-execution-guard.mjs
      - name: Self-audit verify silent-green guard
        run: node scripts/self-audit/guard-verification.mjs
