name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: |
          node --check index.js
          node --check lib/provider.js
          node --check lib/policy.js
      - name: Run test suite
        run: node --test tests/*.test.js
      - name: Self-audit verify silent-green guard
        run: |
          cd scripts/self-audit/fixtures/empty-suite
          npm test >/dev/null 2>&1 && { echo 'ERROR: guard did not catch empty suite'; exit 1; } || echo 'PASS: guard rejects empty suite'
